[project]
name = "flipperbot"
version = "0.1.0"
description = "Finds underpriced watches on Romanian marketplaces"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Facebook Marketplace: a real browser (Playwright), via danyk20's scraper. Needs Python 3.13.
facebook = ["facebook-marketplace-scraper>=0.4.5; python_version >= '3.13'"]

[project.scripts]
flipperbot = "flipperbot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_quick: the test drives the quick AI step itself (with a stand-in for Claude)"]
